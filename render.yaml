services:
  - type: web
    name: rong-than
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO1_URI
        sync: false
      - key: MONGO2_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston